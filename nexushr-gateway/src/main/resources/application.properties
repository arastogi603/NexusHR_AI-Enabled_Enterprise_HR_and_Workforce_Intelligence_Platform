spring.application.name=nexushr-gateway
server.port=8080

# API Doc configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Spring AI Configuration (Replace with real key in production)
spring.ai.openai.api-key=${OPENAI_API_KEY:dummy_key_for_build}
spring.ai.openai.chat.options.model=gpt-4o

# Spring Mail (SMTP) Configuration
spring.mail.host=smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=dummy_user
spring.mail.password=dummy_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

