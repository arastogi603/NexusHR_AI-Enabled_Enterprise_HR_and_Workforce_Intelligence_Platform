spring.application.name=nexushr-gateway
server.port=${PORT:8080}

# API Doc configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Spring AI Configuration (Replace with real key in production)
spring.ai.openai.api-key=${OPENAI_API_KEY:dummy_key_for_build}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o}

# Spring Mail (SMTP) Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.mailtrap.io}
spring.mail.port=${SPRING_MAIL_PORT:2525}
spring.mail.username=${SPRING_MAIL_USERNAME:dummy_user}
spring.mail.password=${SPRING_MAIL_PASSWORD:dummy_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Database Configuration (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/nexushr}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:nexushr}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secretpassword}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Redis Configuration
# spring.data.redis.url=${SPRING_DATA_REDIS_URL:redis://localhost:6379}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}

# JWT Config
jwt.secret=${JWT_SECRET:9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6v8a3d9}
jwt.expiration=${JWT_EXPIRATION:86400000}
