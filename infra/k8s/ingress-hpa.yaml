apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexushr-ingress
  namespace: nexushr
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/websocket-services: "nexushr-backend"
spec:
  tls:
    - hosts:
        - nexushr.demo
      secretName: nexushr-tls
  rules:
    - host: nexushr.demo
      http:
        paths:
          # Backend API routing
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: nexushr-backend
                port:
                  number: 8080
          # WebSocket STOMP routing
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: nexushr-backend
                port:
                  number: 8080
          # Frontend SPA routing
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexushr-frontend
                port:
                  number: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nexushr-backend-hpa
  namespace: nexushr
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nexushr-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
